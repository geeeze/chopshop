server {
    listen 80;
    server_name chopshop.geenet.work;

    # ACME challenges stay plaintext; everything else is temporary until the
    # LE cert lands, then certbot's redirect takes over.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name chopshop.geenet.work;

    # TEMPORARY self-signed cert (openssl req -x509). Replaced by Let's Encrypt
    # once the HTTP-01 challenge passes; while it's live, Cloudflare "Full"
    # (not strict) mode works. Browsers hitting the origin directly will warn.
    ssl_certificate     /etc/nginx/ssl/chopshop-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/chopshop-selfsigned.key;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
