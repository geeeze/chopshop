# GPU pass-through for an NVIDIA host.
#
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d --build flux
#
# Two things are needed, and the second one is the one people miss:
#
#   1. the device NODES, and
#   2. the DRIVER LIBRARIES, placed in the image's MULTIARCH library directory.
#
# The image is Debian, and its loader does not search /usr/lib64. Mount
# libcuda.so.1 at its own host path and it IS visible inside the container --
# `ls /usr/lib64/libcuda.so.1` succeeds -- while torch's dlopen still fails:
#
#   OSError: libcuda.so.1: cannot open shared object file: No such file or directory
#
# and `torch.cuda.is_available()` returns False in a container that plainly
# contains the driver. That reads as a broken device pass-through and sends you
# back to the `devices:` list, which was correct all along. The DESTINATION paths
# below are the fix; the source is the host's own driver directory.
#
# The GPU runtime itself (a torch built for CUDA) is NOT here: it is a venv that
# belongs to the machine with the card, so it is mounted and pointed at from the
# untracked docker-compose.override.yml. See docs/gpu-runtime.md.
#
# A SECOND CARD is not a flag here, for two reasons. Its node (/dev/nvidia1, ...)
# exists only on that host and asking for an absent one is a CREATE failure, and
# WHICH card the service uses must not be decided by slot order -- nvidia-smi
# enumerates in PCI order, so an index pin silently moves to the other tenant's
# card when a board is added or reseated. So the extra node and the UUID pin
# (CUDA_VISIBLE_DEVICES=GPU-<uuid>) both live in the untracked override, and
# docs/gpu-runtime.md has the section "One card or several" with the checks.
#
# One node here is lazy: /dev/nvidia-caps/ appears a few seconds AFTER the others,
# created by the driver's own initialisation, so a start that races it fails at
# create time with `crun: cannot stat /dev/nvidia-caps/nvidia-cap1`. That is a
# boot-ordering problem, not a missing device -- wait for the node (or provoke it
# with `nvidia-smi -L`) before bringing the service up.

services:
  flux:
    devices:
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-uvm
      - /dev/nvidia-caps
    volumes:
      # CHOPSHOP_FLUX_DRIVER_DIR exists for a distribution that keeps the driver
      # somewhere other than /usr/lib64 (Debian keeps it in the multiarch
      # directory, so nothing needs remapping there at all).
      - ${CHOPSHOP_FLUX_DRIVER_DIR:-/usr/lib64}/libcuda.so.1:/usr/lib/x86_64-linux-gnu/libcuda.so.1:ro
      - ${CHOPSHOP_FLUX_DRIVER_DIR:-/usr/lib64}/libnvidia-ml.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
