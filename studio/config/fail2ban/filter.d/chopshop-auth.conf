# fail2ban filter for the chopshop studio login log.
#
# The studio appends one line per failed login to log/chopshop-auth.log — see
# ApplicationController#authenticate in app/controllers/application_controller.rb:
#
#   2026-10-24T12:00:00Z chopshop login failed for 203.0.113.7
#
# That timestamp is ISO 8601 with a literal "Z". fail2ban's date auto-detection
# happens to recognise it today, but the format is stated explicitly anyway: if
# the app's timestamp format ever drifts, an explicit pattern fails LOUDLY (no
# date match, no hit, the jail goes quiet and someone notices) instead of quietly
# depending on whichever templates the installed fail2ban happens to ship. The
# line itself is anchored on the tail only, because fail2ban strips the date it
# matched before testing failregex.
#
# Install next to the jail: config/fail2ban/jail.d/chopshop-auth.local.
[Definition]

datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%SZ

failregex = chopshop login failed for <HOST>$
