# chopshop-jev — the CONSOLIDATED local decision core.
#
# ONE command brings up the whole decision stack:
#
#     cd deploy/jev-core && podman-compose up -d
#     curl 127.0.0.1:8799/health
#
# Then point every caller at the GATEWAY and nothing else:
#
#     JEV_ENDPOINT=http://127.0.0.1:8799/v1/systemone     (annotator)
#     CAPTION_ENDPOINT=http://127.0.0.1:8798              (captioner, separate unit)
#
# WHAT IS IN THE BOX, AND WHY IT IS TWO CONTAINERS AND NOT THREE
# -------------------------------------------------------------
#   gateway  stdlib Python, mounts this repo read-only. Holds NO model, so its
#            footprint is a few tens of MB and it starts instantly. It answers
#            `/v1/systemone` and routes to a backend.
#   laya     the 421M decision model on CPU. The ONLY thing that carries a
#            model, and the only thing that touches weights.
#
# The third thing (OpenRouter / HF) is not a container: it is a URL the gateway
# already speaks. That is the whole point of this package — local and cloud are
# the same wire contract, so a caller never learns which one answered except by
# reading `routing.backend`.
#
# WHY DISK AND NOT MEMORY
# -----------------------
# laya streams its checkpoint from the mounted cache at load time and keeps only
# the resident weights; nothing is copied into the image. MEASURED on loc-node:
# the laya image is 1.28 GB of PACKAGES, the checkpoints stay on the NAS, and a
# 421M model at fp32 is ~1.7 GB resident — which is why `LAYA_DEVICE=cpu` is the
# default and why this stack does not compete with the generator for the GPU.
# If you want it even smaller, `LAYA_MODELS` restricts which checkpoints are
# loadable at all.
#
# Nothing host-specific is tracked here: paths, keys and the model cache live in
# the untracked docker-compose.override.yml (see the .example beside this file).

services:
  # -- the local decision model ---------------------------------------------
  laya:
    build: ../laya
    image: chopshop-laya:0.1.0
    ports:
      # Loopback only. The gateway is the front door; nothing else needs laya.
      - "127.0.0.1:8797:8797"
    environment:
      LAYA_HOST: "0.0.0.0"
      LAYA_PORT: "8797"
      LAYA_DEVICE: "${LAYA_DEVICE:-cpu}"
      LAYA_MODELS: "${LAYA_MODELS:-typed-decisions}"
      LAYA_PRELOAD: "${LAYA_PRELOAD:-1}"
      LAYA_MAX_CONCURRENT: "${LAYA_MAX_CONCURRENT:-4}"
      LAYA_LOG_LEVEL: "${LAYA_LOG_LEVEL:-info}"
      LAYA_API_KEY: "${LAYA_API_KEY:-}"
      HF_HOME: "/var/cache/laya"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-0}"
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      - "${LAYA_CACHE_DIR:-./hf-cache}:/var/cache/laya"
    restart: unless-stopped

  # -- the front door -------------------------------------------------------
  gateway:
    image: python:3.13-slim
    # SELinux: this host is Enforcing, and a bind mount of a path under $HOME is
    # labelled user_home_t, which container_t may not read. Without this the
    # script fails with "Permission denied" and the container exits 2 —
    # MEASURED. Disable the label for THIS container rather than relabelling the
    # checkout (`:z`), because the checkout is a git tree shared with the host.
    security_opt:
      - label=disable
    # The repo is mounted, not copied: the gateway is one stdlib script, so
    # rebuilding an image to change it would be ceremony. Read-only, and the
    # service never writes anywhere.
    volumes:
      - "../..:/srv/chopshop-jev:ro"
    working_dir: /srv/chopshop-jev
    command: ["python3", "scripts/systemone_gateway.py"]
    ports:
      - "127.0.0.1:8799:8799"
    environment:
      SYSTEMONE_HOST: "0.0.0.0"
      SYSTEMONE_PORT: "8799"
      # THE DEFAULT IS LOCAL. A cloud backend is an explicit choice, because
      # "state never leaves the machine" is a property callers rely on.
      SYSTEMONE_BACKEND: "${SYSTEMONE_BACKEND:-local}"
      # Tried in order if the default fails. Empty = fail loudly instead of
      # silently sending the projection to a third party.
      SYSTEMONE_FALLBACK: "${SYSTEMONE_FALLBACK:-}"
      SYSTEMONE_API_KEY: "${SYSTEMONE_API_KEY:-}"
      SYSTEMONE_TIMEOUT: "${SYSTEMONE_TIMEOUT:-60}"
      # In-container name for the service above.
      LAYA_ENDPOINT: "${LAYA_ENDPOINT:-http://laya:8797}"
      LAYA_API_KEY: "${LAYA_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-google/gemini-2.5-flash}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_MODEL: "${HF_MODEL:-Qwen/Qwen2.5-7B-Instruct}"
      SYSTEMONE_LOG_LEVEL: "${SYSTEMONE_LOG_LEVEL:-}"
    depends_on:
      - laya
    restart: unless-stopped
