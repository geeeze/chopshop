# Recurring Solid Queue housekeeping. Only finished-job pruning is needed: the
# queue depth cap counts live jobs, so finished rows must be cleared out or the
# solid_queue_jobs table grows without bound on a busy box.
production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
